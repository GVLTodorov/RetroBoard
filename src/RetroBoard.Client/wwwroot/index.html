<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroBoard - Real-Time Sprint Retrospective Board</title>
    <meta name="description"
        content="Free, real-time sprint retrospective board. Create a board, share the link, add sticky notes, vote, and walk away with tracked action items — no sign-up required." />
    <meta name="keywords"
        content="retrospective, sprint retro, agile retrospective, retro board, dot voting, action items" />
    <meta name="author" content="Georgi Todorov" />
    <base href="/" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
