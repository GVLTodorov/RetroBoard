name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  release:
    types:
      - created

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RetroBoard.slnx

      - name: Build
        run: dotnet build RetroBoard.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test RetroBoard.slnx --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: ./coverage/**/coverage.cobertura.xml
          targetdir: ./coverage/report
          reporttypes: Html;MarkdownSummaryGithub

      - name: Add coverage summary to job summary
        run: cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: ./coverage/report/

  # Tracks the Blazor WASM download size -- "the primary perf metric users actually feel"
  # (REQUIREMENTS.MD Section 9). Deliberately not in `release`'s `needs:`: perf checks don't gate
  # every commit the way the test suite does.
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check bundle size
        shell: pwsh
        run: ./src/RetroBoard.Client/scripts/check-bundle-size.ps1

  # Micro-benchmarks for domain hot paths and JSON serialization (REQUIREMENTS.MD Section 9).
  # `--job short` trades precision for a runtime that fits a shared CI runner; same non-gating
  # treatment as bundle-size -- these track trends, they don't block a commit over CI-runner noise.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run benchmarks
        working-directory: src/RetroBoard.Tests.Benchmarks
        run: dotnet run -c Release -- --filter '*' --job short

      - name: Add report to job summary
        if: always()
        working-directory: src/RetroBoard.Tests.Benchmarks
        run: |
          for f in BenchmarkDotNet.Artifacts/results/*-report-github.md; do
            echo "### $(basename "$f" -report-github.md)" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: src/RetroBoard.Tests.Benchmarks/BenchmarkDotNet.Artifacts/

  # Gated on `test` -- same tag-bump/build/push shape as the sibling PlanningPoker project's
  # pipeline (REQUIREMENTS.MD Section 3), so the version bump and image push never happen on a
  # broken build.
  release:
    needs: test
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Determine image version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.tag_version.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
