name: Load Test (100 Boards x 5 Participants)

# Manual only: drives N boards x M participants (real SignalR connections, no browsers) against a
# live instance, has every participant write K cards, then exports every board as its facilitator
# -- purely to see what RetroBoard.Api itself costs (and whether it still behaves correctly) under
# sustained concurrent load. Not gated into ci.yml, same non-gating treatment PlanningPoker gives
# this class of test (REQUIREMENTS.MD Section 9's load/soak-test bullet): scale like this isn't
# meant to block every push/PR, only to be run on demand from the Actions tab.
#
# Default is 100 boards x 5 participants x 3 cards (500 connections, 1,500 AddCard calls, then 100
# exports) -- 100 concurrent retros of a realistic size, rather than 100 boards each with 100
# participants. A 100x100 (10,000-connection) run was also tried, on a standard GitHub-hosted
# runner (2 CPU / 7 GB RAM): it ran for about 20 minutes before hitting a plain "Connection reset by
# peer" with no corresponding exception in the API's own log -- reads as the small shared runner
# running out of some resource under that many real concurrent connections, not an app bug. The
# inputs below can still push scale up toward that (or further, against bigger/self-hosted
# infrastructure); `set -o pipefail` ensures a crash like that surfaces as a genuine failed run
# rather than a false green.
on:
  workflow_dispatch:
    inputs:
      board_count:
        description: Number of boards
        required: false
        default: "100"
      participants_per_board:
        description: Participants per board
        required: false
        default: "5"
      cards_per_participant:
        description: Cards each participant writes
        required: false
        default: "3"
  workflow_call:
    inputs:
      board_count:
        type: string
        default: "100"
      participants_per_board:
        type: string
        default: "5"
      cards_per_participant:
        type: string
        default: "3"

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build RetroBoard.slnx -c Release

      # `dotnet build`'s output only serves static files (index.html, the Blazor framework files,
      # css/js) via a manifest pointing back to source-tree intermediate paths -- fine for
      # `dotnet run`, but running that DLL directly (as this job does) 404s on every static asset.
      # `dotnet publish` bundles a real, portable wwwroot, same as the Dockerfile already does for
      # the production image.
      - name: Publish the app
        run: dotnet publish src/RetroBoard.Api/RetroBoard.Api.csproj -c Release -o publish/api

      - name: Start the app
        env:
          ASPNETCORE_URLS: http://localhost:6233
        run: |
          # ContentRootPath defaults to the process's working directory (the repo root here), not
          # the published DLL's own folder, so WebRootPath resolves to <repo root>/wwwroot (doesn't
          # exist) unless --contentRoot is given explicitly. It must be absolute: a relative value
          # gets resolved against the DLL's base directory, not this shell's cwd, and silently
          # doubles the path.
          dotnet publish/api/RetroBoard.Api.dll --contentRoot "$GITHUB_WORKSPACE/publish/api" > api.log 2>&1 &
          echo $! > api.pid
          timeout 30 bash -c 'until curl -sf http://localhost:6233/healthz >/dev/null; do sleep 1; done'

      - name: Run load test (writes, then export every board)
        env:
          BOARD_COUNT: ${{ inputs.board_count }}
          PARTICIPANTS_PER_BOARD: ${{ inputs.participants_per_board }}
          CARDS_PER_PARTICIPANT: ${{ inputs.cards_per_participant }}
        run: |
          # `| tee` alone would let this step report success even if `dotnet run` crashes -- a pipe's
          # exit status is its last command's (tee, which always succeeds), not the load test's. Bash
          # doesn't check this by default, so it must be turned on explicitly.
          set -o pipefail
          dotnet run --project src/RetroBoard.Tests.LoadTest -c Release --no-build -- \
            http://localhost:6233 "$BOARD_COUNT" "$PARTICIPANTS_PER_BOARD" "$CARDS_PER_PARTICIPANT" | tee load-test.log
          {
            echo "### Load test: $BOARD_COUNT boards x $PARTICIPANTS_PER_BOARD participants x $CARDS_PER_PARTICIPANT cards, then export"
            echo '```'
            cat load-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show app server log
        if: always()
        run: cat api.log || true

      - name: Stop the app
        if: always()
        run: kill "$(cat api.pid)" || true
