# Example compose file. Same shape as the sibling PlanningPoker project's deployment
# (see REQUIREMENTS.MD Section 4.1) -- unlike that project, RetroBoard has no optional external
# integration at all yet, so there are no environment variables to configure: the app runs fully
# featured with zero configuration.
services:
  retroboard:
    image: ghcr.io/gvltodorov/retroboard:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retroboard
    restart: unless-stopped
    ports:
      - 8141:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
